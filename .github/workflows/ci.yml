name: CI

# External actions are pinned to full commit SHAs to prevent supply-chain
# attacks via tag reassignment. Run `gh api repos/OWNER/REPO/git/refs/tags/vN`
# to look up the current SHA when upgrading.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Pest (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - name: Checkout plugin
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, mbstring
          # The 8.4 build produces the coverage report and the JUnit XML
          # the SonarCloud scan job below ingests, so it needs the driver.
          coverage: pcov
          tools: composer

      - name: Install ffmpeg
        # Muse STT provider shells out to ffmpeg for browser-container → PCM WAV
        # conversion. Required by MuseTranscribeProviderTest happy paths.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Resolve spora-core from Packagist
        # `update` (not `install`) so CI resolves the declared `>=0.30.0 <2.0.0`
        # floor against the real release instead of a pinned local checkout.
        run: composer update spora-ai/spora-core --with-all-dependencies --no-interaction --prefer-dist # NOSONAR githubactions:S8546 — floating versions are the point: this job must resolve the declared >=0.30.0 floor against whatever Packagist actually serves, not replay a lock

      - name: Run Pest
        # The 8.4 run writes the coverage + JUnit artefacts the scan job
        # ingests (clover.xml, junit.xml — what sonar-project.properties
        # points at); 8.5 runs the suite plain, to surface syntax / runtime
        # diffs across PHP versions.
        run: |
          if [ "${{ matrix.php }}" = "8.4" ]; then
            ./vendor/bin/pest \
              --coverage-filter=src \
              --coverage-clover=coverage/clover.xml \
              --coverage-cobertura=coverage/cobertura.xml \
              --coverage-html=coverage/html \
              --log-junit=coverage/junit.xml
          else
            ./vendor/bin/pest
          fi

      - name: Upload coverage artifacts
        # Only upload from the 8.4 build — the 8.5 sibling is identical
        # source-wise and would race the upload step.
        if: matrix.php == '8.4'
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4.4.0
        with:
          name: pest-coverage
          path: coverage/
          retention-days: 7

  static-analysis:
    name: PHPStan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout plugin
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer

      - name: Resolve spora-core from Packagist
        # `update` (not `install`) so CI resolves the declared `>=0.30.0 <2.0.0`
        # floor against the real release instead of a pinned local checkout.
        run: composer update spora-ai/spora-core --with-all-dependencies --no-interaction --prefer-dist # NOSONAR githubactions:S8546 — floating versions are the point: this job must resolve the declared >=0.30.0 floor against whatever Packagist actually serves, not replay a lock

      - name: Run PHPStan
        run: ./vendor/bin/phpstan analyse --no-progress

  code-style:
    name: php-cs-fixer (dry-run)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout plugin
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer

      - name: Resolve spora-core from Packagist
        # `update` (not `install`) so CI resolves the declared `>=0.30.0 <2.0.0`
        # floor against the real release instead of a pinned local checkout.
        run: composer update spora-ai/spora-core --with-all-dependencies --no-interaction --prefer-dist # NOSONAR githubactions:S8546 — floating versions are the point: this job must resolve the declared >=0.30.0 floor against whatever Packagist actually serves, not replay a lock

      - name: Check code style
        # Same ruleset as Spora core's .php-cs-fixer.php so plugin style matches host.
        run: ./vendor/bin/php-cs-fixer fix --dry-run --diff --no-interaction

  sonarcloud:
    name: SonarCloud scan
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    needs: test
    steps:
      - name: Checkout
        # fetch-depth: 0 so SonarCloud can attribute issues via git blame;
        # without it "new code" falls back to the last commit and skews
        # the quality gate.
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.4'
          extensions: curl, mbstring
          coverage: pcov
          tools: composer

      - name: Resolve spora-core from Packagist
        # `update` (not `install`) so CI resolves the declared `>=0.30.0 <2.0.0`
        # floor against the real release instead of a pinned local checkout.
        run: composer update spora-ai/spora-core --with-all-dependencies --no-interaction --prefer-dist # NOSONAR githubactions:S8546 — floating versions are the point: this job must resolve the declared >=0.30.0 floor against whatever Packagist actually serves, not replay a lock

      - name: Download coverage report
        # Pull the artefacts the Pest job wrote back, so the scanner
        # ingests them in its own run.
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: pest-coverage
          path: coverage

      - name: Record the analysed commit's timestamp
        id: commit-time
        # The guard below accepts an analysis carrying this commit's SHA that
        # was published no earlier than the commit itself. The bound is the
        # commit's timestamp rather than the start of this run: the analysis
        # is published by SonarCloud after it receives it, and the commit is
        # the earliest moment that analysis can describe.
        run: |
          sha="${{ github.event.pull_request.head.sha || github.sha }}"
          committed_at="$(git log -1 --format=%ct "$sha" 2>/dev/null || true)"
          if [ -z "$committed_at" ]; then
            committed_at="$(git log -1 --format=%ct HEAD)"
          fi
          echo "committed-at=$committed_at" >> "$GITHUB_OUTPUT"

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          # v8.x of the SonarSource action takes projectBaseDir as a
          # dedicated input (it sets -Dsonar.projectBaseDir internally);
          # passing `--project-base-dir=...` via `args` makes the CLI
          # reject the flag.
          projectBaseDir: ${{ github.workspace }}

      - name: Assert an analysis landed
        # The scan step above can report success while SonarCloud stored
        # nothing: with Automatic analysis enabled on the project the upload
        # is accepted and no analysis is published — the job would go green
        # having measured nothing. This step asks SonarCloud what it stored
        # and fails when the answer is "nothing".
        #
        # A push publishes its analysis on the branch, a pull request on the
        # pull request, so the two are looked for in different places. A tag
        # ref never gets an analysis — SonarCloud files it under
        # refs/tags/<tag> and publishes nothing — so the guard steps aside.
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          COMMITTED_AT: ${{ steps.commit-time.outputs.committed-at }}
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          COMMIT_SHA: ${{ github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          API="https://sonarcloud.io/api"
          PROJECT_KEY="$(sed -n 's/^sonar\.projectKey=//p' sonar-project.properties | head -1)"
          DEADLINE=$(( $(date +%s) + 120 ))

          if [ -z "${SONAR_TOKEN:-}" ]; then
            echo "::error::SONAR_TOKEN is empty — the guard cannot ask SonarCloud what it stored."
            exit 1
          fi

          if [ -z "$PROJECT_KEY" ]; then
            echo "::error::sonar.projectKey is missing from sonar-project.properties."
            exit 1
          fi

          if [ "$REF_TYPE" = "tag" ]; then
            echo "Tag push — SonarCloud publishes no analysis for a tag ref, nothing to assert."
            exit 0
          fi

          published() {
            if [ "$EVENT_NAME" = "pull_request" ]; then
              curl -fsS -H "Authorization: Bearer $SONAR_TOKEN" \
                "$API/project_pull_requests/list?project=$PROJECT_KEY" \
                | jq --arg pr "$PR_NUMBER" --arg head "$PR_HEAD_SHA" --arg sha "$COMMIT_SHA" --argjson since "$COMMITTED_AT" '
                    [ .pullRequests[]?
                      | select(.key == $pr)
                      | select(.commit != null and (.commit.sha == $head or .commit.sha == $sha))
                      | select(.analysisDate != null)
                      | select((.analysisDate | sub("\\+0000$"; "Z") | fromdateiso8601) >= $since)
                    ] | length'
            else
              curl -fsS -H "Authorization: Bearer $SONAR_TOKEN" \
                "$API/project_analyses/search?project=$PROJECT_KEY&ps=100" \
                | jq --arg sha "$COMMIT_SHA" '[ .analyses[]? | select(.revision == $sha) ] | length'
            fi
          }

          while :; do
            COUNT="$(published 2>/dev/null || echo 0)"
            case "$COUNT" in
              ''|*[!0-9]*) COUNT=0 ;;
            esac
            if [ "$COUNT" -gt 0 ]; then
              echo "SonarCloud published an analysis for $COMMIT_SHA."
              exit 0
            fi
            if [ "$(date +%s)" -ge "$DEADLINE" ]; then
              break
            fi
            sleep 10
          done

          echo "::error::No analysis for $COMMIT_SHA landed in $PROJECT_KEY. The scan reported success but SonarCloud stored nothing — with Automatic analysis enabled on this project it owns the analyses and discards the CI ones. Turn Automatic analysis off in the SonarCloud project settings."
          exit 1
