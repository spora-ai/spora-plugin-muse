# One SonarCloud project per repository, and this file is the only thing
# that says which one. The project already exists with a green gate before
# this repository ever scanned, because SonarCloud's **Automatic analysis**
# (autoscan) is enabled for `spora-ai/spora-plugin-muse`: autoscan
# provisions and analyses the project with its own configuration
# (`sonar.sources=.`, no test tree, `sonar.coverage.exclusions=**/*`) and
# never reads this file. So it analyses `tests/` as production code, ingests
# no coverage, and answers a `pullRequest=` link that is not the real one.
#
# The fix is on the SonarCloud side, not here: turn Automatic analysis off
# for `spora-ai/spora-plugin-muse`. The CI job below then scans every push
# and pull request with the configuration in this file.
sonar.projectKey=spora-ai_spora-plugin-muse
sonar.projectName=spora-plugin-muse
sonar.projectVersion=0.2.0
sonar.organization=spora-ai

sonar.sources=src
sonar.tests=tests
sonar.sourceEncoding=UTF-8

sonar.php.coverage.reportPaths=coverage/clover.xml
# `reportPath`, singular — the spelling the PHPUnit sensor reads, and the
# one it names when it finds nothing ("No PHPUnit tests reports provided
# (see 'sonar.php.tests.reportPath' property)"). The plural spelling is not
# a known key and is ignored, so the JUnit XML the Pest job writes is
# silently dropped. The path must match the `--log-junit=` path in
# .github/workflows/ci.yml.
sonar.php.tests.reportPath=coverage/junit.xml

# `tests/**` is deliberately NOT excluded. Declaring `sonar.tests` and then
# excluding the same directory is a contradiction: the tree is announced as
# the test suite and then removed from the analysis, so its code smells
# never reach the pull request that introduced them and the test-execution
# report has nothing to attach to. Autoscan's own configuration excludes
# the test tree — this file puts it back under analysis.
sonar.exclusions=vendor/**,coverage/**

sonar.pullrequest.provider=GitHub
sonar.pullrequest.github.repository=spora-ai/spora-plugin-muse

sonar.cpd.exclusions=src/**/*.php
